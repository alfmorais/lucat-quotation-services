<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Cotações{% endblock %}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1>Lucat Sistema de Cotações</h1>
        <div class="row mt-4">
            <!-- Sidebar comum -->
            <div class="col-3">
                <div class="nav flex-column nav-pills" role="tablist" aria-orientation="vertical">
                    <a class="nav-link {% if request.path == '/products' %}active{% endif %}"
                        href="{% url 'product-list' %}">Produtos</a>
                    <a class="nav-link {% if request.path == '/taxes/' %}active{% endif %}"
                        href="{% url 'tax-list' %}">Impostos</a>
                    <a class="nav-link {% if request.path == '/quotations/' %}active{% endif %}"
                        href="{% url 'quotation-list' %}">Cotações</a>
                </div>
            </div>

            <!-- Conteúdo dinâmico -->
            <div class="col-9">
                {% block content %}
                <!-- Conteúdo específico da página vai aqui -->
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Scripts do Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
</body>

</html>
