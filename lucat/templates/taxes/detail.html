{% extends "base.html" %}
{% block title %}Produtos{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">{{ object.description }}</h3>
        </div>
        <div class="card-body">
            <p><strong>Porcentagem:</strong> {{ object.percentage }}%</p>
            <p><strong>Valor:</strong> R$ {{ object.tax_amount }}</p>
            <p><strong>Tipo:</strong> {{ object.get_scope_display }}</p>
        </div>
        <div class="card-footer">
            <a href="{% url 'tax-edit' object.pk %}" class="btn btn-warning btn-sm">Editar</a>
            <a href="{% url 'tax-delete' object.pk %}" class="btn btn-danger btn-sm">Excluir</a>
            <a href="{% url 'tax-list' %}" class="btn btn-secondary btn-sm">← Voltar</a>
        </div>
    </div>
</div>
{% endblock %}
