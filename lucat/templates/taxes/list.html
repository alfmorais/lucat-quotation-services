<h1>Lista de Impostos</h1>

<a href="{% url 'tax-create' %}">Novo imposto</a>

<ul>
    {% for tax in taxes %}
    <li>
        <a href="{% url 'tax-detail' tax.pk %}">
            {{ tax.description }} ({{ tax.scope }}) - {{ tax.percentage }} OU {{ tax.tax_amount}}%
        </a>
    </li>
    {% empty %}
    <li>Nenhum imposto cadastrado.</li>
    {% endfor %}
</ul>
