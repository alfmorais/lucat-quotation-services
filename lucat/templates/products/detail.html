{% extends "base.html" %}
{% block title %}Produtos{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">{{ product.name }}</h3>
        </div>
        <div class="card-body">
            <p><strong>Descrição:</strong> {{ product.description }}</p>
            <p><strong>NCM:</strong> {{ product.ncm_code }}</p>
            <p><strong>Preço:</strong> R$ {{ product.price }}</p>
        </div>
        <div class="card-footer">
            <a href="{% url 'product-update' product.pk %}" class="btn btn-warning btn-sm">Editar</a>
            <a href="{% url 'product-delete' product.pk %}" class="btn btn-danger btn-sm">Excluir</a>
            <a href="{% url 'product-list' %}" class="btn btn-secondary btn-sm">Voltar</a>
        </div>
    </div>
</div>
{% endblock %}
