<h1>{{ product.name }}</h1>
<p><strong>Descrição:</strong> {{ product.description }}</p>
<p><strong>NCM:</strong> {{ product.ncm_code }}</p>
<p><strong>Preço:</strong> R$ {{ product.price }}</p>

<a href="{% url 'product-update' product.pk %}">Editar</a> |
<a href="{% url 'product-delete' product.pk %}">Excluir</a> |
<a href="{% url 'product-list' %}">Voltar</a>
