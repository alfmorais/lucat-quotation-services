{% extends "base.html" %}
{% block title %}Produtos{% endblock %}

{% block content %}
<h1>Lista de Produtos</h1>
<a href="{% url 'product-create' %}" class="btn btn-primary mb-3">Criar novo produto</a>

<div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Detalhes</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>R$ {{ product.price }}</td>
                <td>
                    <a href="{% url 'product-detail' product.pk %}" class="btn btn-sm btn-info">Ver</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
